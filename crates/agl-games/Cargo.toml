[package]
name = "agl-games"
version = "0.3.0"
authors = ["Nikita Podvirnyi <krypt0nn@dawn.wine>"]
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

[dependencies]
agl-locale = { path = "../agl-locale" }

thiserror = "1.0"
serde_json = "1.0"

os_info = "3.15"

mlua = { version = "0.12", features = ["luau-jit"] }

# Tracing
tracing = { version = "0.1", optional = true }
