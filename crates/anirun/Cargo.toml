[package]
name = "anirun"
version = "0.1.3"
description = "Anime Games Launcher runtime modules CLI"
authors = ["Nikita Podvirnyi <krypt0nn@dawn.wine>"]
homepage = "https://github.com/an-anime-team/anime-games-launcher"
repository = "https://github.com/an-anime-team/anime-games-launcher"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[features]
mimalloc = ["dep:mimalloc"]

sqlite-api = ["agl-runtime/sqlite-api"]
protobuf-api = ["agl-runtime/protobuf-api"]
torrent-api = ["agl-runtime/torrent-api"]
portal-api = ["agl-runtime/portal-api", "dep:notify-rust"]
secrets-api = ["agl-runtime/secrets-api"]

default = [
    "mimalloc",
    "sqlite-api",
    "protobuf-api",
    "torrent-api",
    "portal-api",
    "secrets-api"
]

[dependencies.agl-core]
path = "../agl-core"
default-features = false
features = [
    "tasks",
    "network-all",
    "tracing"
]

[dependencies.agl-runtime]
path = "../agl-runtime"
default-features = false
features = [
    "tracing",
    "packages-support"
]

[dependencies]
agl-locale = { path = "../agl-locale", default-features = false }
agl-packages = { path = "../agl-packages" }

clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"

# Portal API
notify-rust = { version = "4.17", optional = true }

tracing = "0.1"
tracing-subscriber = "0.3"

# Mimalloc
mimalloc = { version = "0.1", optional = true }
