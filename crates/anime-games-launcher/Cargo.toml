[package]
name = "anime-games-launcher"
version = "2.2.0"
description = "Anime Games Launcher"
authors = ["Nikita Podvirnyi <krypt0nn@dawn.wine>"]
homepage = "https://github.com/an-anime-team/anime-games-launcher"
repository = "https://github.com/an-anime-team/anime-games-launcher"
license = "GPL-3.0-or-later"
edition = "2024"
build = "build.rs"
publish = false

[features]
mimalloc = ["dep:mimalloc"]

sqlite-api = ["agl-runtime/sqlite-api"]
protobuf-api = ["agl-runtime/protobuf-api"]
torrent-api = ["agl-runtime/torrent-api"]
portal-api = ["agl-runtime/portal-api", "dep:notify-rust"]
secrets-api = ["agl-runtime/secrets-api"]

default = [
    "mimalloc",
    "sqlite-api",
    "protobuf-api",
    "torrent-api",
    "portal-api",
    "secrets-api"
]

[build-dependencies]
glib-build-tools = "0.21.0"

[dependencies.relm4]
version = "0.11"
features = ["macros", "libadwaita"]

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_18"]

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_7"]

[dependencies.agl-core]
path = "../agl-core"
default-features = false
features = [
    "tasks",
    "network-all",
    "tracing"
]

[dependencies.agl-runtime]
path = "../agl-runtime"
default-features = false
features = [
    "tracing",
    "packages-support"
]

[dependencies]
agl-locale = { path = "../agl-locale", default-features = false }
agl-packages = { path = "../agl-packages" }
agl-games = { path = "../agl-games" }

anyhow = "1.0"
lazy_static = "1.5"
toml = "1.1"
serde_json = "1.0"

time = "0.3"

# Portal API
notify-rust = { version = "4.17", optional = true }

tracing = "0.1"
tracing-subscriber = "0.3"
human-panic = "2.0"

# Mimalloc
mimalloc = { version = "0.1", optional = true }
